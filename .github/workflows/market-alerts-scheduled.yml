name: Market Alerts Scheduled

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  market-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Run market alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
          WATCHLIST_SOURCE: ${{ secrets.WATCHLIST_SOURCE || 'yaml' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_RANGE: ${{ secrets.GOOGLE_SHEETS_RANGE || 'Watchlist!A2:A' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND || 'sqlite' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}
          USE_AI: ${{ secrets.USE_AI || 'true' }}
          AI_THRESHOLD: ${{ secrets.AI_THRESHOLD || '4' }}
          MIN_SCORE_TO_NOTIFY: ${{ secrets.MIN_SCORE_TO_NOTIFY || '6' }}
          MAX_GPT_CALLS_PER_RUN: ${{ secrets.MAX_GPT_CALLS_PER_RUN || '10' }}
        run: python -m src.main
